name: Multiple Jobs 

on:
    push

jobs:
    build_job:
        runs-on: ubuntu-latest
        steps:
            - name: Install Dependencies
              run: sudo apt-get install cowsay -y

            - name: Execute Cowfay
              run: cowsay -f dragon "Run for a cover, I'm a DRAGON.......WrarWrar" >> dragon.txt

            - name: upload dragon.txt file
              uses: actions/upload-artifacts@v7
              with:
                name: dragon-text-file
                path: dragon.txt
    
    test_job:
      needs: build_job
      runs-on: ubuntu-latest
      steps:

        - name: Download the dragon file
          uses: actions/download-artifact@v7
          with: 
            name: dragon-text-file

        - name: Test file exists
          run: grep -i "dragon" dragon.txt

    deploy_job:
      needs: [test_job]
      runs-on: ubuntu-latest
      steps:
        
        - name: Download the dragon file
          uses: actions/download-artifact@v7
          with:
            name: dragon-text-file

        - name: Read text file
          run: cat dragon.txt


         